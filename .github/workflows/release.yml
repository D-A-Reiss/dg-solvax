name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Release bump (set to start a new release; leave empty to retry finalize with "tag")'
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
      notes:
        description: 'Release notes (markdown)'
        required: false
        type: string
      tag:
        description: 'Tag to finalize a pending release (e.g. v1.2.3; requires "notes")'
        required: false
        type: string
  pull_request:
    types: [closed]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Allow only the repository owner to release
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ACTOR" != "$OWNER" ]; then
            echo "::error::Releases may only be triggered by $OWNER, got $ACTOR."
            exit 1
          fi
      - name: Validate inputs
        env:
          BUMP: ${{ inputs.bump }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$BUMP" ] && [ -n "$TAG" ]; then
            echo "::error::Provide either 'bump' (new release) or 'tag' (retry finalize), not both."
            exit 1
          fi
          if [ -z "$BUMP" ] && [ -z "$TAG" ]; then
            echo "::error::Provide 'bump' (new release) or 'tag' (retry finalize)."
            exit 1
          fi
      - name: Allow releases from main only
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases may only be cut from main, got $GITHUB_REF."
            exit 1
          fi

  ci:
    if: github.event_name == 'workflow_dispatch' && inputs.bump != ''
    needs: guard
    uses: ./.github/workflows/ci.yml

  docs:
    if: github.event_name == 'workflow_dispatch' && inputs.bump != ''
    needs: guard
    uses: ./.github/workflows/docs.yml

  release-prep:
    if: github.event_name == 'workflow_dispatch' && inputs.bump != ''
    needs: [ci, docs]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      branch: ${{ steps.version.outputs.branch }}
      pr: ${{ steps.pr.outputs.number }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Configure git identity
        run: |
          git config user.name "David A. Reiss"
          git config user.email "dav.reiss@t-online.de"
      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          uv version --bump "$BUMP"
          TAG="v$(uv version --short)"
          BRANCH="release/$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Build package
        run: uv build
      - name: Create release branch
        env:
          BRANCH: ${{ steps.version.outputs.branch }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git checkout -b "$BRANCH"
          git add pyproject.toml uv.lock
          git commit -m "release $TAG"
          git push origin "$BRANCH"
      - name: Open release pull request
        id: pr
        env:
          BRANCH: ${{ steps.version.outputs.branch }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          printf '%s' "$NOTES" > "$RUNNER_TEMP/notes.md"
          URL="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "release $TAG" \
            --body-file "$RUNNER_TEMP/notes.md")"
          echo "number=${URL##*/}" >> "$GITHUB_OUTPUT"
      - name: Enable auto-merge
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: gh pr merge "$PR" --auto --squash
      - name: Roll back on failure
        if: failure()
        env:
          PR: ${{ steps.pr.outputs.number }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          if [ -n "$PR" ]; then
            gh pr close "$PR" --delete-branch || true
          fi
          git push --delete origin "$BRANCH" || true

  finalize-gate:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.tag != '') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.user.login == 'github-actions[bot]' &&
       startsWith(github.event.pull_request.title, 'release v'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      notes: ${{ steps.resolve.outputs.notes }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve release tag and notes
        id: resolve
        env:
          TAG_INPUT: ${{ inputs.tag }}
          NOTES_INPUT: ${{ inputs.notes }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          ACTOR="${{ github.actor }}"
          OWNER="${{ github.repository_owner }}"
          if [ -n "$TAG_INPUT" ] && [ "$ACTOR" != "$OWNER" ]; then
            echo "::error::Finalizing via workflow_dispatch is restricted to $OWNER, got $ACTOR."
            exit 1
          fi
          if [ -n "$TAG_INPUT" ]; then
            TAG="$TAG_INPUT"
            printf '%s' "$NOTES_INPUT" > notes.md
            if [ ! -s notes.md ]; then
              echo "::error::Finalizing a release requires non-empty 'notes'."
              exit 1
            fi
          else
            case "$PR_TITLE" in
              "release "*) TAG="${PR_TITLE#release }" ;;
              *) echo "::error::Unexpected pull request title: '$PR_TITLE'." && exit 1 ;;
            esac
            printf '%s' "$PR_BODY" > notes.md
            if [ ! -s notes.md ]; then
              echo "::error::The release pull request body (release notes) is empty."
              exit 1
            fi
          fi
          {
            echo "tag=$TAG"
            echo "notes<<NOTES_EOF"
            cat notes.md
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  finalize-verify:
    needs: finalize-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Verify main carries the released version
        env:
          TAG: ${{ needs.finalize-gate.outputs.tag }}
        run: |
          MAIN_VERSION="$(uv version --short)"
          if [ "$MAIN_VERSION" != "${TAG#v}" ]; then
            echo "::error::main is at version $MAIN_VERSION, tag says ${TAG#v}. Re-run after resolving the drift."
            exit 1
          fi

  finalize-tag:
    needs: [finalize-gate, finalize-verify]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.finalize-gate.outputs.tag }}
      NOTES: ${{ needs.finalize-gate.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Configure git identity
        run: |
          git config user.name "David A. Reiss"
          git config user.email "dav.reiss@t-online.de"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Build package
        run: uv build
      - name: Tag release commit
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "Tag $TAG already exists; reusing it."
          else
            printf '%s' "$NOTES" > "$RUNNER_TEMP/notes.md"
            git tag -a "$TAG" -F "$RUNNER_TEMP/notes.md"
            git push origin "$TAG"
          fi
      - name: Create draft release
        run: |
          printf '%s' "$NOTES" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
          else
            gh release create "$TAG" \
              --draft \
              --verify-tag \
              --title "$TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --generate-notes
          fi
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - name: Roll back on failure
        if: failure()
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          git push --delete origin "$TAG" || true
          echo "::warning::main keeps the bumped version; publish can be retried via workflow_dispatch with tag '$TAG' and the notes."

  publish:
    needs: [finalize-gate, finalize-tag]
    runs-on: ubuntu-latest
    environment: pypi
    env:
      TAG: ${{ needs.finalize-gate.outputs.tag }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
      - name: Roll back on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          git push --delete origin "$TAG" || true

  finalize:
    needs: [finalize-gate, publish]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.finalize-gate.outputs.tag }}
    steps:
      - name: Make draft release public
        run: gh release edit "$TAG" --draft=false
