name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Release type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      notes:
        description: Release notes (markdown)
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Allow releases from main only
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases may only be cut from main, got $GITHUB_REF."
            exit 1
          fi


  ci:
    needs: guard
    uses: ./.github/workflows/ci.yml

  docs:
    needs: guard
    uses: ./.github/workflows/docs.yml

  release-prep:
    needs: [ci, docs]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Configure git identity
        run: |
          git config user.name "David A. Reiss"
          git config user.email "dav.reiss@t-online.de"
      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          uv version --bump "$BUMP"
          echo "tag=v$(uv version --short)" >> "$GITHUB_OUTPUT"
      - name: Build package
        run: uv build
      - name: Commit version bump
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git add pyproject.toml uv.lock
          git commit -m "release $TAG"
          git push origin HEAD:main
      - name: Tag release commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          git tag -a "$TAG" -m "$NOTES"
          git push origin "$TAG"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --notes "$NOTES" \
            --generate-notes
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - name: Roll back on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          git push --delete origin "$TAG" || true
          if [ "$(git log -1 --format=%s)" = "release $TAG" ]; then
            git revert --no-edit HEAD || true
            git push origin HEAD:main || true
          fi



  publish:
    needs: release-prep
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Configure git identity
        run: |
          git config user.name "David A. Reiss"
          git config user.email "dav.reiss@t-online.de"
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
      - name: Roll back on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-prep.outputs.tag }}
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          git push --delete origin "$TAG" || true
          git fetch --depth=2 origin main
          git reset --hard origin/main
          if [ "$(git log -1 --format=%s)" = "release $TAG" ]; then
            git revert --no-edit HEAD || true
            git push origin HEAD:main || true
          fi




  finalize:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Make draft release public
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-prep.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
