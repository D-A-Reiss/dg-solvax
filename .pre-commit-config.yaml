repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        pass_filenames: false
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --group lint --no-sync ruff format
        language: system
        types: [python]
      - id: ruff-lint
        name: ruff lint
        entry: uv run --group lint --no-sync ruff check --fix
        language: system
        types: [python]
      - id: pytest
        name: pytest
        entry: uv run --group dev --no-sync pytest
        language: system
        pass_filenames: false
        always_run: true
